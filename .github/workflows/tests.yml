name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy matplotlib pillow python-dotenv black
      - name: Formatting and regression tests
        env:
          MPLBACKEND: Agg
        run: |
          black --check arpesnn tests scripts
          python -m unittest discover -s tests -v
      - name: End-to-end CPU smoke run
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python arpesnn/demo.py --output outputs/demo
          python arpesnn/corpus.py --output arpesnn/dataset/ci --train 10 --validation 10 --test 10 --ood 2 --size 32 --workers 1
          python arpesnn/train_tasks.py --corpus arpesnn/dataset/ci --output arpesnn/models/ci --task denoise --epochs 1 --batch-size 5 --workers 0
          python arpesnn/denoise.py --input outputs/demo/noisy.npy --checkpoint arpesnn/models/ci/denoise/best_model.pt --size 32 --device cpu --output outputs/prediction
